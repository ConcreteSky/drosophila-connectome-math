[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain_rl"
version = "0.2.0"
description = "FlyWire v783 Drosophila whole-brain spiking neural network trained on math via reward/punishment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3.0",
    "fastapi>=0.115",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
train = [
    "scipy>=1.13",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
